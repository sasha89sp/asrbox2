name: asrbox
description: "ASRbox — приватное кроссплатформенное рабочее пространство для Windows и Android: заметки и таблицы с формулами, изолированные сейфы паролей, календарь, закрытые группы и чат, синхронизация WebDAV и инструменты продуктивности."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
